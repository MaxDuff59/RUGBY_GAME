# Essai de l'API en local dans son image : http://localhost:8000/docs
#   docker compose up --build
# Les parties et les comptes restent dans le volume `rugby-data`. L'interface se
# lance à part (`npm run dev` dans frontend/, qui relaie /api vers ce port).
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - rugby-data:/data
    environment:
      # Pas de HTTPS en local : le cookie de session ne doit pas être marqué Secure.
      RUGBY_COOKIE_SECURE: "0"
    restart: unless-stopped

volumes:
  rugby-data:
